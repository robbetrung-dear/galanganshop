<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Membuka Panel Admin...</title>
  <style>
    body { background: #0c4a6e; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; margin: 0; }
    .box { text-align: center; }
    .spinner { border: 4px solid #94a3b8; border-top: 4px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    try {
      sessionStorage.setItem('dapur_login_gate', 'true');
      sessionStorage.setItem('dapur_admin_session', 'true');
      sessionStorage.setItem('dapur_kasir_session', JSON.stringify({
        username: 'owner', kasirName: 'Admin Utama', role: 'owner', loginAt: new Date().toISOString(), shiftId: 'SHIFT-ADMIN'
      }));
      window.location.replace('/index.html?admin=1');
    } catch(e) { console.error(e); }
  </script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Membuka Panel Admin...</p>
  </div>
</body>
</html>
