<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Galangan Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center text-white">
    <div class="text-center space-y-8 p-8 max-w-lg w-full">
        <!-- Logo -->
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-brand-600 shadow-xl mb-2" style="background-color: #0ea5e9;">
            <span class="text-3xl font-black">GS</span>
        </div>
        
        <div>
            <h1 class="text-3xl font-bold tracking-tight">Panel Admin</h1>
            <p class="text-slate-400 mt-2">Pilih tujuan Anda untuk melanjutkan.</p>
        </div>
        
        <div class="flex flex-col gap-4">
            <!-- Pilihan 1: Lihat Toko -->
            <a href="/index.html" 
               class="group w-full py-5 px-6 bg-white text-slate-900 rounded-2xl font-bold text-lg transition-all hover:scale-105 hover:shadow-2xl flex items-center justify-between border-2 border-transparent hover:border-sky-400">
                <span class="flex items-center gap-3">
                    <i class="fa-solid fa-store text-sky-600 text-xl"></i>
                    Lihat Toko (Landing Page)
                </span>
                <i class="fa-solid fa-arrow-right text-slate-400 group-hover:text-sky-600 transition"></i>
            </a>
            
            <!-- Pilihan 2: Lanjut Panel Admin -->
            <a href="/admin-bridge.html" class="group w-full py-5 px-6 bg-sky-600 text-white rounded-2xl font-bold text-lg transition-all hover:scale-105 hover:shadow-2xl flex items-center justify-between border-2 border-transparent hover:border-sky-300">
            <span class="flex items-center gap-3">
            <i class="fa-solid fa-lock text-sky-200 text-xl"></i>
            Lanjut Panel Admin
            </span>
            <i class="fa-solid fa-arrow-right text-sky-300 group-hover:text-white transition"></i>
            </a>
        </div>
        
        <div class="pt-4 border-t border-slate-700">
            <a href="/login-gate.html" class="text-sm text-slate-500 hover:text-white transition underline">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Login
            </a>
        </div>
    </div>
</body>
</html>
